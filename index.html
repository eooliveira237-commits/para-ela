<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Você</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf3ef;--ink:#3b2a30;--muted:#94777f;--rose:#c4627f;--gold:#b98e5b;--paper:#fffdfb;--line:#ecdcd6}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden}
.script{font-family:'Great Vibes',cursive}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:36px;padding:20px;font-size:13px;letter-spacing:.25em;text-transform:uppercase;transition:.3s}
nav.solid{background:rgba(250,243,239,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
nav a{color:var(--ink);text-decoration:none;opacity:.7}
nav a:hover{opacity:1;color:var(--rose)}

#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 24px 60px;position:relative;
background:radial-gradient(circle at 20% 15%,#f6d5dc 0,transparent 45%),radial-gradient(circle at 85% 80%,#f3e0c8 0,transparent 45%),var(--bg)}
#home .eyebrow{font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
#home h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(64px,16vw,150px);color:var(--rose);line-height:1.05;margin:14px 0}
#home p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,3vw,28px);max-width:560px;color:var(--muted)}
.divider{width:70px;height:1px;background:var(--gold);margin:26px auto}
.cue{position:absolute;bottom:28px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:float 2.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(8px)}}

section.block{max-width:1100px;margin:0 auto;padding:110px 24px}
.head{text-align:center;margin-bottom:56px}
.head small{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.head h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(36px,6vw,56px);margin-top:6px}

.gallery{columns:3 260px;column-gap:18px}
.photo{break-inside:avoid;margin-bottom:18px;position:relative;overflow:hidden;border-radius:6px;cursor:zoom-in;background:#eadad5;box-shadow:0 8px 24px rgba(120,70,80,.12)}
.photo img{display:block;width:100%;transition:transform .7s}
.photo:hover img{transform:scale(1.05)}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;color:#fff;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;background:linear-gradient(transparent,rgba(40,20,28,.65));opacity:0;transition:.4s}
.photo:hover span{opacity:1}
.ph{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:14px;background:linear-gradient(135deg,#f5d9df,#f3e6d4)}
.add{display:block;margin:30px auto 0;padding:11px 26px;border:1px solid var(--rose);background:none;color:var(--rose);border-radius:999px;font:inherit;font-size:13px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.add:hover{background:var(--rose);color:#fff}

.letter{max-width:680px;margin:0 auto;background:var(--paper);padding:64px 56px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(120,70,80,.12);position:relative}
.letter::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none}
.letter p{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,2.6vw,24px);margin-bottom:20px}
.letter p:first-child::first-letter{font-family:'Great Vibes',cursive;font-size:2.4em;color:var(--rose);line-height:0}
.sign{text-align:right;font-family:'Great Vibes',cursive!important;font-size:38px!important;color:var(--rose);margin:30px 0 0!important}
footer{text-align:center;padding:50px 20px 70px;color:var(--muted);font-size:13px;letter-spacing:.2em;text-transform:uppercase}

.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s,transform 1s}
.reveal.in{opacity:1;transform:none}

#lb{position:fixed;inset:0;z-index:50;background:rgba(30,16,22,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:78vh;border-radius:4px}
#lb p{color:#f3e0e6;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;margin-top:16px;text-align:center}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:38px;cursor:pointer;opacity:.7;padding:14px}
#lb button:hover{opacity:1}
.x{top:10px;right:14px}.pv{left:8px;top:50%}.nx{right:8px;top:50%}
@media(max-width:600px){.letter{padding:46px 28px}nav{gap:20px}}

/* ===== TELA INICIAL ===== */
body.locked{overflow:hidden}
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.curtain{position:absolute;top:0;bottom:0;width:50%;
  background:radial-gradient(circle at 30% 20%,#f6d5dc 0,transparent 55%),radial-gradient(circle at 80% 90%,#f3e0c8 0,transparent 50%),var(--bg);
  transition:transform 1.6s cubic-bezier(.77,0,.18,1) .3s}
.curtain.l{left:0}
.curtain.r{right:0}
#intro.open .curtain.l{transform:translateX(-101%)}
#intro.open .curtain.r{transform:translateX(101%)}

.intro-box{position:relative;transition:opacity .6s,transform .6s}
#intro.open .intro-box{opacity:0;transform:scale(.9)}
.intro-heart{font-size:64px;color:var(--rose);animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.intro-box h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(48px,13vw,84px);color:var(--rose);line-height:1.1;margin:6px 0}
.intro-box p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(19px,3vw,24px);color:var(--muted);margin-bottom:30px}
#enter{padding:14px 34px;border:1px solid var(--rose);background:var(--rose);color:#fff;border-radius:999px;font:inherit;font-size:13px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 30px rgba(196,98,127,.35);transition:.3s}
#enter:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(196,98,127,.45)}

/* corações subindo */
.heart-fly{position:fixed;bottom:-40px;z-index:101;color:var(--rose);pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}

/* entrada do texto da home */
#home .eyebrow,#home h1,#home .divider,#home p{opacity:0;transform:translateY(24px);transition:opacity 1.2s,transform 1.2s}
body.entered #home .eyebrow{opacity:1;transform:none;transition-delay:.3s}
body.entered #home h1{opacity:1;transform:none;transition-delay:.7s}
body.entered #home .divider{opacity:1;transform:none;transition-delay:1.1s}
body.entered #home p{opacity:1;transform:none;transition-delay:1.4s}

/* botão de som */
#mute{position:fixed;right:16px;bottom:16px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--rose);background:rgba(255,253,251,.9);color:var(--rose);font-size:20px;cursor:pointer;display:none}
#mute.off{opacity:.5;text-decoration:line-through}

</style>
</head>
<body>

<div id="intro">
  <div class="curtain l"></div>
  <div class="curtain r"></div>
  <div class="intro-box">
    <div class="intro-heart">♥</div>
    <h2 id="introNome"></h2>
    <p>Preparei uma coisinha especial pra você</p>
    <button id="enter">Abrir presente</button>
  </div>
</div>

<audio id="music" src="musica/musica.mp3" loop preload="auto"></audio>
<button id="mute" aria-label="Som">♪</button>

<nav id="nav"><a href="#home">Home</a><a href="#galeria">Galeria</a><a href="#mensagem">Mensagem</a></nav>

<section id="home">
  <div class="eyebrow">Feito especialmente para</div>
  <h1 id="nome"></h1>
  <div class="divider"></div>
  <p id="sub"></p>
  <div class="cue">role</div>
</section>

<section class="block" id="galeria">
  <div class="head reveal"><small>Nossos momentos</small><h2>Galeria</h2></div>
  <div class="gallery" id="gal"></div>
  <button class="add" id="addBtn">Pré-visualizar minhas fotos</button>
  <input type="file" id="file" accept="image/*" multiple hidden>
</section>

<section class="block" id="mensagem">
  <div class="head reveal"><small>Do fundo do coração</small><h2>Mensagem</h2></div>
  <div class="letter reveal" id="letter"></div>
</section>

<footer>Feito com amor ♥</footer>

<div id="lb"><button class="x" id="lx">×</button><button class="pv" id="lp">‹</button><img id="li" alt=""><p id="lc"></p><button class="nx" id="ln">›</button></div>

<script>
/* ================= EDITE AQUI ================= */
var CONFIG = {
  nome: "Isys Oliveira",
  subtitulo: "MInha futura esposa.",
  assinatura: "Com todo o meu amor",
  mensagem: [
    "Amor da minha vida,me falta palavras quando se trata  de expressar meu amor por você, você é extremamente importante para min!.",
    "Meu amor você me fez mudar para uma pessoa mujito melhor, sei que sou muito dificíl às vezes mais obrigado por sempre me entender.",
    "Não canso em dizer que TE AMO, meu coração grita e anseia por você."
  ],
  /* Coloque suas fotos numa pasta chamada "fotos" ao lado deste arquivo */
  fotos: [
    {src:"fotos/foto1.jpg", legenda:""},
    {src:"fotos/foto2.jpg", legenda:""},
    {src:"fotos/foto3.jpg", legenda:""},
    {src:"fotos/foto4.jpg", legenda:""},
    {src:"fotos/foto5.jpg", legenda:""},
    {src:"fotos/foto6.jpg", legenda:""}
  ]
};
/* ============================================== */

var $=function(i){return document.getElementById(i)};
$('nome').textContent=CONFIG.nome;
$('sub').textContent=CONFIG.subtitulo;
document.title='Para '+CONFIG.nome;

var letter=$('letter');
CONFIG.mensagem.forEach(function(t){var p=document.createElement('p');p.textContent=t;letter.appendChild(p)});
var s=document.createElement('p');s.className='sign';s.textContent=CONFIG.assinatura;letter.appendChild(s);

var gal=$('gal'),cur=0;
function addPhoto(src,leg){
  var d=document.createElement('div');d.className='photo reveal';
  var im=new Image();im.src=src;im.alt=leg||'';im.loading='lazy';
  im.onerror=function(){d.innerHTML='<div class="ph">'+(leg||'Foto')+'<br>(coloque a foto em '+src+')</div>';d.style.cursor='default';d.onclick=null};
  d.appendChild(im);
  if(leg){var c=document.createElement('span');c.textContent=leg;d.appendChild(c)}
  d.onclick=function(){open(d)};
  gal.appendChild(d);io.observe(d);
}
function list(){return Array.prototype.filter.call(gal.querySelectorAll('.photo'),function(p){return p.querySelector('img')})}
function open(d){cur=list().indexOf(d);show();$('lb').classList.add('on')}
function show(){var l=list();if(!l.length)return;cur=(cur+l.length)%l.length;var im=l[cur].querySelector('img');$('li').src=im.src;$('lc').textContent=im.alt}
$('lx').onclick=function(){$('lb').classList.remove('on')};
$('lp').onclick=function(){cur--;show()};
$('ln').onclick=function(){cur++;show()};
$('lb').onclick=function(e){if(e.target.id==='lb')$('lb').classList.remove('on')};
document.onkeydown=function(e){if(!$('lb').classList.contains('on'))return;if(e.key==='Escape')$('lx').click();if(e.key==='ArrowLeft')$('lp').click();if(e.key==='ArrowRight')$('ln').click()};

var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll('.reveal').forEach(function(e){io.observe(e)});
CONFIG.fotos.forEach(function(f){addPhoto(f.src,f.legenda)});

$('addBtn').onclick=function(){$('file').click()};
$('file').onchange=function(){
  Array.prototype.forEach.call(this.files,function(f){var r=new FileReader();r.onload=function(e){addPhoto(e.target.result,f.name.replace(/\.[^.]+$/,''))};r.readAsDataURL(f)});
  gal.querySelectorAll('.ph').forEach(function(p){p.parentNode.remove()});
};
window.addEventListener('scroll',function(){$('nav').classList.toggle('solid',scrollY>40)});

/* ===== TELA INICIAL + MÚSICA ===== */
var music=$('music'), intro=$('intro');
document.body.classList.add('locked');
$('introNome').textContent=CONFIG.nome.split(' ')[0];   // só o primeiro nome

function fadeIn(){
  music.volume=0;
  var v=0, t=setInterval(function(){
    v+=0.02; if(v>=0.7){v=0.7;clearInterval(t)}
    music.volume=v;
  },100);
}

function hearts(){
  for(var i=0;i<28;i++){
    (function(i){
      setTimeout(function(){
        var h=document.createElement('div');
        h.className='heart-fly';
        h.textContent='♥';
        h.style.left=Math.random()*100+'vw';
        h.style.fontSize=(16+Math.random()*30)+'px';
        h.style.opacity=.5+Math.random()*.5;
        h.style.animationDuration=(3+Math.random()*3)+'s';
        document.body.appendChild(h);
        setTimeout(function(){h.remove()},6500);
      },i*90);
    })(i);
  }
}

$('enter').onclick=function(){
  music.play().then(fadeIn).catch(function(){});
  intro.classList.add('open');
  hearts();
  $('mute').style.display='block';
  setTimeout(function(){
    document.body.classList.remove('locked');
    document.body.classList.add('entered');
  },900);
  setTimeout(function(){intro.remove()},2400);
};

$('mute').onclick=function(){
  if(music.paused){music.play();this.classList.remove('off')}
  else{music.pause();this.classList.add('off')}
};

</script>
</body>
</html>
